<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SHARE COVER EFFECT (OG TAGS) -->
    <title>金道彦 ❤ 金梅 婚礼邀请函</title>
    <meta name="description" content="诚邀您见证我们的幸福时刻 | 2026.05.24">
    <meta property="og:title" content="金道彦 ❤ 金梅 婚礼邀请函">
    <meta property="og:description" content="诚邀您见证我们的幸福时刻 | 2026.05.24">
    <meta property="og:image" content="https://kdoen.github.io/16_BJS02649.jpg">
    <meta property="og:type" content="website">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@200;300;400;500&family=Dancing+Script:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-paper: #f9f8f4;
            --text-main: #333333;
            --accent-red: #A42423;
        }
        body { 
            font-family: 'Noto Serif SC', serif; 
            background-color: #d6d6d6;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .paper-texture {
            background-color: var(--bg-paper);
            background-image: url("https://www.transparenttextures.com/patterns/paper-fibers.png");
        }
        .cursive { font-family: 'Dancing Script', cursive; }
        
        .invitation-spread {
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            box-shadow: 0 30px 60px rgba(0,0,0,0.15);
            background-color: var(--bg-paper);
            position: relative;
        }

        @media (max-width: 768px) {
            .invitation-spread {
                grid-template-columns: 1fr;
                max-width: 450px;
            }
            .center-crease { display: none; }
        }

        .center-crease {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 1px;
            background: linear-gradient(to right, rgba(0,0,0,0.03), rgba(0,0,0,0), rgba(0,0,0,0.03));
            z-index: 10;
        }

        .main-wedding-photo {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        .thank-you-container {
            margin-top: 32px;
            text-align: center;
        }

        /* Watermark Cover for Illustration */
        .illustration-patch {
            position: absolute;
            top: 0;
            left: 0;
            width: 30%;
            z-index: 20;
            pointer-events: none;
        }

        /* Refined Heart Styling */
        .heart-svg {
            display: inline-block;
            width: 18px;
            height: 18px;
            fill: var(--accent-red);
            margin: 0 8px;
            vertical-align: middle;
            filter: drop-shadow(0 1px 1px rgba(0,0,0,0.1));
        }
    </style>
</head>
<body class="antialiased">

    <div class="invitation-spread paper-texture">
        <div class="center-crease"></div>

        <!-- LEFT SIDE -->
        <div class="p-6 md:p-10 flex flex-col items-center justify-center border-b md:border-b-0 md:border-r border-stone-200">
            <div class="cursive text-[11px] text-stone-700 italic mb-6 tracking-wider">
                "In the flow of time, love is the only eternity."
            </div>

            <div class="w-full max-w-[360px] mb-8 text-center">
                <img id="main-photo" src="https://kdoen.github.io/16_BJS02649.jpg" 
                     alt="Main Wedding Photo" class="main-wedding-photo">
                
                <div class="mt-8">
                    <p class="text-xl tracking-[0.3em] text-[#A42423] uppercase font-medium">婚礼邀请函</p>
                    <p class="text-[9px] tracking-[0.2em] text-stone-700 uppercase font-light mt-1">Welcome to our wedding</p>
                </div>
            </div>

            <div class="text-center">
                <div class="text-sm tracking-[0.2em] text-stone-800 font-medium space-y-2">
                    <p>感谢所有的相遇与爱意</p>
                    <p>这是一场人生中难得的相聚</p>
                    <p>这一年，这一天</p>
                    <p>诚邀您来见证与分享</p>
                </div>
                
                <h1 class="text-1xl font-medium tracking-[0.2em] text-stone-800 mt-8 flex items-center justify-center">
                    金道彦 
                    <svg class="heart-svg" viewBox="0 0 24 24">
                        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                    </svg>
                    金梅
                </h1>
            </div>
        </div>

        <!-- RIGHT SIDE -->
        <div class="p-8 md:p-12 flex flex-col items-center justify-center text-center">
            <div class="mb-10">
                <p class="cursive text-[#A42423] text-1xl">日期 / Date</p>
                <div class="mt-4 space-y-1">
                    <p class="text-base tracking-widest border-b border-stone-800 inline-block pb-1">2026.05.24 11:00</p>
                    <p class="text-[12px] text-stone-700">丙午年 四月初八 星期日</p>
                </div>
            </div>

            <div class="w-full max-w-[240px] mb-8 flex items-center justify-center relative">
                <img id="photo-patch" src="https://kdoen.github.io/%E6%88%AA%E5%B1%8F2026-04-18%2023.28.46.png" 
                     alt="Patch" class="illustration-patch">
                
                <img id="custom-illustration" src="https://kdoen.github.io/wedding-character-transparent.png" 
                     alt="Wedding Character" class="max-w-full h-auto object-contain">
            </div>

            <p class="cursive text-[#A42423] text-1xl">地址 / Address</p>
            <div class="mt-4 space-y-6 text-xs md:text-sm leading-relaxed text-stone-600 font-light">
                <div class="space-y-1 mb-6">
                    <p class="text-stone-800 font-medium tracking-widest">STARCITY ARTHALL 5F</p>
                    <p class="text-[11px] text-stone-700">110 Neungdong-ro, Gwangjin-gu, Seoul, Republic of Korea</p>
                </div>

                <div class="text-sm tracking-[0.2em] text-stone-800 font-medium">
                    <p>期待，婚礼见</p>
                </div>

                <div class="thank-you-container">
                    <p class="cursive text-xl text-[#A42423] font-medium">Thank You</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const CONFIG = {
            mainPhoto: "https://kdoen.github.io/16_BJS02649.jpg",
            patchPhoto: "https://kdoen.github.io/%E6%88%AA%E5%B1%8F2026-04-18%2023.28.46.png",
            characterImg: "https://kdoen.github.io/wedding-character-transparent.png"
        };

        window.onload = () => {
            document.getElementById('main-photo').src = CONFIG.mainPhoto;
            document.getElementById('photo-patch').src = CONFIG.patchPhoto;
            document.getElementById('custom-illustration').src = CONFIG.characterImg;
        };
    </script>
</body>
</html>
