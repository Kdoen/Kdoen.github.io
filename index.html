<script>
    // --- LIVE MAP INITIALIZATION ---
    function initMap() {
        // Exact coordinates for Star City Art Hall
        var venueLocation = new naver.maps.LatLng(37.539824, 127.070942);

        var mapOptions = {
            center: venueLocation,
            zoom: 16,
            scrollWheel: false // Keeps the page from scrolling weirdly on mobile
        };

        var map = new naver.maps.Map('map', mapOptions);

        // Add a pin/marker
        var marker = new naver.maps.Marker({
            position: venueLocation,
            map: map
        });
    }

    // Call map function
    initMap();

    // --- COUNTDOWN LOGIC (Already included from previous turn) ---
    const weddingDate = new Date("May 24, 2026 11:00:00").getTime();
    setInterval(function() {
        const now = new Date().getTime();
        const diff = weddingDate - now;
        document.getElementById("d-days").innerText = Math.floor(diff / (1000 * 60 * 60 * 24));
        document.getElementById("d-hours").innerText = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        document.getElementById("d-mins").innerText = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        document.getElementById("d-secs").innerText = Math.floor((diff % (1000 * 60)) / 1000);
    }, 1000);
</script>
